name: nieuwsbot

on:
  schedule:
    - cron: '*/5 * * * *'   # elke 5 minuten (GitHub kan soms wat later starten)
  workflow_dispatch:         # handmatig starten via de knop "Run workflow"

permissions:
  contents: write            # om signalen.csv en gezien.txt te bewaren

concurrency:
  group: nieuwsbot
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Nieuws checken en meldingen sturen
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Europe/Amsterdam
        run: ./nieuwsbot.ps1 -EenKeer

      - name: Gegevens bewaren
        run: |
          git config user.name "nieuwsbot"
          git config user.email "nieuwsbot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "nieuwsbot: ronde $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
